interface:
  display_name: "SSH Key Provision"
  short_description: "Configure Linux SSH keys, Codex CLI, and remote prerequisite repairs."
  default_prompt: "Use $ssh-key-provision to configure SSH key login, install Codex CLI, or repair VS Code Remote-SSH/Codex Desktop prerequisites for a Linux server; ask me for host, port, username, and password if needed."
policy:
  allow_implicit_invocation: true
